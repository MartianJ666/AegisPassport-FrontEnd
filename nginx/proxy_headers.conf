# Shared proxy headers. X-Forwarded-* let the backend (forward-headers-strategy
# = framework) reconstruct the public origin for the OIDC issuer and redirects.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Preserve the scheme supplied by the TLS-terminating host proxy. `$scheme`
# is HTTP inside this container and would otherwise generate http:// OAuth
# return URLs for public HTTPS requests.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_http_version 1.1;
