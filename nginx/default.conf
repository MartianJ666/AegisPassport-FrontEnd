# Single-origin serving: this nginx serves the Vue SPA *and* reverse-proxies
# every backend path, so browser + API + OAuth all share one origin. That keeps
# the authorization-server session cookie first-party (the old two-origin setup
# broke SAS sessions across localhost:2718 → localhost:4562).
#
# The backend is reached as service "server" on port 8421 inside the compose
# network. forward-headers-strategy=framework on the backend trusts the
# X-Forwarded-* headers set below so the issuer/redirects resolve to the public
# origin rather than the internal container address.

upstream aegis_backend {
    server server:8421;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # gzip compression - the base nginx.conf ships with it disabled.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2 font/woff;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    # Container healthcheck target: cheap 200, no SPA/backend dependency.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SAS redirects the browser to /oauth2/consent when consent is required.
    # Exact-match (= has top priority) serves the SPA consent page here instead
    # of proxying to the backend, which would bounce back and loop forever.
    location = /oauth2/consent {
        try_files $uri /index.html;
    }

    # Account-confirmation gate page (sso.*). Served by the SPA like the consent
    # page — must not proxy to the backend.
    location = /oauth2/account-confirm {
        try_files $uri /index.html;
    }

    # --- Backend-proxied paths -------------------------------------------------
    location = /oauth-continue.js { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }
    location ^~ /api/           { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }
    location ^~ /oauth2/        { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }
    location ^~ /oidc/          { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }
    location ^~ /connect/       { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }
    location = /userinfo        { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }
    location ^~ /.well-known/   { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }
    location ^~ /uploads/       { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }
    location ^~ /swagger-ui/    { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }
    location ^~ /v3/api-docs    { proxy_pass http://aegis_backend; include /etc/nginx/proxy_headers.conf; }

    # --- Static assets ---------------------------------------------------------
    location ~* \.(?:css|js|map|ico|png|jpe?g|gif|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA fallback ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
